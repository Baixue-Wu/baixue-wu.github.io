[project]
name = "baixue-profile"
version = "0.1.0"
description = "Builds the animated SVG assets of Baixue Wu's GitHub profile."
requires-python = ">=3.11"
dependencies = ["numpy", "pillow", "fonttools", "imageio-ffmpeg"]

[project.scripts]
profile-extract = "profile_assets.extract:main"
profile-render = "profile_assets.render:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/profile_assets"]
