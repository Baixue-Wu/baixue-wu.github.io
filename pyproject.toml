[project]
name = "baixue-site"
version = "0.1.0"
description = "Builds the media, fonts and animated SVGs of Baixue Wu's website."
requires-python = ">=3.11"
dependencies = ["numpy", "pillow", "fonttools", "brotli", "imageio-ffmpeg"]

[project.scripts]
site-extract = "site_assets.extract:main"
site-render = "site_assets.render:main"
site-fonts = "site_assets.fonts:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/site_assets"]
